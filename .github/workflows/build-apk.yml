name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Install dependencies
        run: npm install
      
      - name: Install Capacitor CLI
        run: npm install @capacitor/cli @capacitor/core @capacitor/android

      - name: Fix WebDir and Sync Capacitor
        run: |
          mkdir -p dist
          if [ -f "index.html" ]; then cp index.html dist/; fi
          sed -i 's/"webDir": "."/"webDir": "dist"/g' capacitor.config.json || true
          npx cap sync android

      - name: Decode Signing Key
        run: |
          echo "${{ secrets.SIGNING_KEY }}" | base64 -d > android/app/my-upload-key.jks

      - name: Build Signed APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=my-upload-key.jks \
            -Pandroid.injected.signing.store.password=${{ secrets.KEY_STORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: Upload Signed APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Secret-x-Signed-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 90
