name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: # Manual run ke liye button

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' # Stable version
          cache: 'npm'
      
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17' # Android build ke liye best
      
      - name: Install Dependencies
        run: npm ci
      
      - name: Install Capacitor & Android Platform
        run: |
          npm install @capacitor/core @capacitor/android @capacitor/cli
          npx cap init "Secret-x" "com.secretx.app" --web-dir=. --force
          npx cap add android
      
      - name: Sync Web Assets
        run: npx cap sync android
      
      - name: Decode Signing Key (Optional for Debug)
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/my-upload-key.jks || true
      
      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
      
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Secret-x-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
