name: Build Android APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
      
      - name: Prepare Web Assets for Capacitor
        run: |
          mkdir -p www
          cp index.html manifest.json sw.js www/
          cp -r css js assets legal www/
          echo "Files copied to www folder successfully"
      
      - name: Initialize Capacitor
        run: |
          npm install -g @capacitor/cli @capacitor/core @capacitor/android
          rm -f capacitor.config.json capacitor.config.ts
          npx cap init "Secret-x" "com.secretx.app" --web-dir=www
          npx cap add android
      
      - name: Sync Web Assets
        run: npx cap sync android
      
      - name: Decode Signing Key (Optional)
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/my-upload-key.jks || true
      
      - name: Build Debug APK
        run: |
          cd android
          chmod +x ./gradlew
          ./gradlew assembleDebug --stacktrace
      
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Secret-x-Debug-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
