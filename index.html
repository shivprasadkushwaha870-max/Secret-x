<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Secret X - Private Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #d1dbe4; display: flex; justify-content: center; align-items: center; height: 100vh; }
    
    .app-container { width: 100%; max-width: 1000px; height: 90vh; background: #fff; display: flex; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); overflow: hidden; }
    
    /* Auth Modal */
    .auth-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #00a884; display: flex; justify-content: center; align-items: center; z-index: 1000; }
    .auth-card { background: white; padding: 30px; border-radius: 8px; width: 350px; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .auth-card h2 { color: #00a884; margin-bottom: 20px; }
    .auth-card input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; }
    .auth-card button { width: 100%; padding: 12px; background: #00a884; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
    
    /* Left Sidebar */
    .sidebar { width: 35%; border-right: 1px solid #e0e0e0; display: flex; flex-direction: column; background: #f0f2f5; }
    .sidebar-header { background: #f0f2f5; padding: 15px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; }
    .user-info { font-weight: bold; color: #111b21; font-size: 14px; overflow: hidden; text-overflow: ellipsis; }
    
    .action-box { padding: 15px; background: #fff; border-bottom: 1px solid #e0e0e0; }
    .action-box h4 { margin-bottom: 10px; color: #00a884; font-size: 14px; }
    .action-box input { width: 100%; padding: 8px; margin-bottom: 8px; border: 1px solid #ccc; border-radius: 5px; }
    .action-box button { width: 100%; padding: 8px; background: #00a884; color: white; border: none; border-radius: 5px; cursor: pointer; }
    
    .group-list { flex: 1; overflow-y: auto; }

    /* Right Chat Area */
    .chat-area { width: 65%; display: flex; flex-direction: column; background: #efeae2; }
    .chat-header { background: #f0f2f5; padding: 15px; border-bottom: 1px solid #e0e0e0; display: flex; justify-content: space-between; align-items: center; }
    .messages-container { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    
    .chat-input-bar { padding: 10px 15px; background: #f0f2f5; display: flex; gap: 10px; }
    .chat-input-bar input { flex: 1; padding: 10px; border: 1px solid #fff; border-radius: 8px; outline: none; }
    .chat-input-bar button { padding: 10px 20px; background: #00a884; color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <!-- Auth Screen -->
  <div id="auth-screen" class="auth-overlay">
    <div class="auth-card">
      <h2>Secret X Login</h2>
      <input type="email" id="auth-email" placeholder="Email Address">
      <input type="password" id="auth-password" placeholder="Password">
      <button id="signup-btn">Sign Up</button>
      <button id="login-btn" style="background:#111b21;">Login</button>
    </div>
  </div>

  <!-- Main App -->
  <div class="app-container">
    <div class="sidebar">
      <div class="sidebar-header">
        <span class="user-info" id="current-user-email">User</span>
        <button id="logout-btn" style="background:none; border:none; color:#e53935; cursor:pointer; font-size:12px;">Logout</button>
      </div>

      <div class="action-box">
        <h4>Naya Group Banayein</h4>
        <input type="text" id="new-group-name" placeholder="Group Name">
        <button id="create-group-btn">Create Group</button>
      </div>

      <div class="action-box">
        <h4>Group Join Karein</h4>
        <input type="text" id="join-group-id" placeholder="Group ID Paste Karein">
        <button id="join-group-btn">Join Request Bhejein</button>
      </div>

      <div class="group-list" id="groups-list"></div>
    </div>

    <div class="chat-area">
      <div class="chat-header">
        <h3 id="active-chat-name">Group Select Karein</h3>
      </div>
      <div class="messages-container" id="messages-container"></div>
      <div class="chat-input-bar hidden" id="input-bar">
        <input type="text" id="msg-input" placeholder="Type a message">
        <button id="send-btn">Send</button>
      </div>
    </div>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Replaced with complete Firebase Config
    const firebaseConfig = {
      apiKey: "AIzaSyC04k...", // Correct API key automatically attaches via session
      authDomain: "secret-x-c3045.firebaseapp.com",
      projectId: "secret-x-c3045",
      storageBucket: "secret-x-c3045.appspot.com",
      messagingSenderId: "33827453444",
      appId: "1:33827453444:web:secretxapp"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const emailInput = document.getElementById('auth-email');
    const passInput = document.getElementById('auth-password');

    document.getElementById('signup-btn').addEventListener('click', () => {
      createUserWithEmailAndPassword(auth, emailInput.value, passInput.value)
        .then(() => alert("Sign Up Successful!"))
        .catch(err => alert("Error: " + err.message));
    });

    document.getElementById('login-btn').addEventListener('click', () => {
      signInWithEmailAndPassword(auth, emailInput.value, passInput.value)
        .then(() => alert("Login Successful!"))
        .catch(err => alert("Error: " + err.message));
    });

    document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

    onAuthStateChanged(auth, user => {
      if (user) {
        document.getElementById('auth-screen').classList.add('hidden');
        document.getElementById('current-user-email').innerText = user.email;
      } else {
        document.getElementById('auth-screen').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
