<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secret X - Private Group Chat</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #0f172a; color: #ffffff; text-align: center; padding: 20px; margin: 0; }
        .box { background-color: #1e293b; max-width: 450px; margin: 20px auto; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        input, button { width: 90%; padding: 10px; margin: 8px 0; border-radius: 6px; border: none; box-sizing: border-box; }
        input { background-color: #334155; color: white; }
        button { background-color: #0284c7; color: white; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #0369a1; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <h1>🔒 Secret X App</h1>

    <!-- 1. Authentication Box -->
    <div id="auth-box" class="box">
        <h2>Login / Sign Up</h2>
        <input type="email" id="email" placeholder="Email daalein">
        <input type="password" id="password" placeholder="Password daalein">
        <button onclick="register()">Sign Up (Naya Account)</button>
        <button onclick="login()">Login</button>
    </div>

    <!-- 2. Dashboard Box -->
    <div id="dashboard-box" class="box hidden">
        <h2>Secret Groups</h2>
        <p id="user-display" style="color: #38bdf8;"></p>
        <input type="text" id="group-name" placeholder="Naye Group Ka Naam">
        <button onclick="createGroup()">Create New Group (You = Admin)</button>
        <hr style="border-color: #334155; margin: 15px 0;">
        <h3>Join Existing Group</h3>
        <input type="text" id="join-group-id" placeholder="Group ID Paste Karein">
        <button onclick="requestJoinGroup()">Join Request Bhejein</button>
        <hr style="border-color: #334155; margin: 15px 0;">
        <button onclick="logout()" style="background-color: #ef4444;">Logout</button>
    </div>

    <!-- Firebase SDK Modules -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, addDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Aapka Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyCX9myU2sx-LCyGAUsKuVEOJJXo7jhurdg",
            authDomain: "secret-x-c3045.firebaseapp.com",
            projectId: "secret-x-c3045",
            storageBucket: "secret-x-c3045.firebasestorage.app",
            messagingSenderId: "116252360970",
            appId: "1:116252360970:web:98622eb77bf5646c89baf3"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Sign Up
        window.register = async () => {
            const e = document.getElementById("email").value;
            const p = document.getElementById("password").value;
            try { await createUserWithEmailAndPassword(auth, e, p); alert("Account ban gaya!"); } 
            catch (err) { alert(err.message); }
        };

        // Login
        window.login = async () => {
            const e = document.getElementById("email").value;
            const p = document.getElementById("password").value;
            try { await signInWithEmailAndPassword(auth, e, p); } 
            catch (err) { alert(err.message); }
        };

        // Logout
        window.logout = () => signOut(auth);

        // Auth Listener
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById("auth-box").classList.add("hidden");
                document.getElementById("dashboard-box").classList.remove("hidden");
                document.getElementById("user-display").innerText = "Logged in: " + user.email;
            } else {
                document.getElementById("auth-box").classList.remove("hidden");
                document.getElementById("dashboard-box").classList.add("hidden");
            }
        });

        // Create Group
        window.createGroup = async () => {
            const name = document.getElementById("group-name").value;
            if(!name) return alert("Group name daalein!");
            try {
                const docRef = await addDoc(collection(db, "groups"), {
                    name: name,
                    admin: auth.currentUser.uid,
                    members: [auth.currentUser.uid],
                    pendingRequests: []
                });
                alert("Group Created! Group ID: " + docRef.id);
                document.getElementById("group-name").value = "";
            } catch(e) { alert(e.message); }
        };

        // Request to Join Group
        window.requestJoinGroup = async () => {
            const groupID = document.getElementById("join-group-id").value;
            if(!groupID) return alert("Group ID daalein!");
            try {
                const groupRef = doc(db, "groups", groupID);
                await updateDoc(groupRef, {
                    pendingRequests: arrayUnion(auth.currentUser.uid)
                });
                alert("Join Request Bhej Di Gayi Hai! Admin approve karega.");
                document.getElementById("join-group-id").value = "";
            } catch(e) { alert("Invalid Group ID ya Error: " + e.message); }
        };
    </script>
</body>
</html>
